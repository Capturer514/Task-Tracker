<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Tracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css"> </head>
    <body class="bg-light">

        <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh ;">
            <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
                <h3 class="card-title text-center mb-4">Task Tracker Login</h3>

                <div id="Login-alert" class="alert alert-danger d-none" role="alert">
                    Invalid Username or Password.
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form=label">Username (e.g., student)</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="passowrd" class="form-label"> Password (e.g., student)</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">Hint: Use 'student' and "abcde"</p>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script></body>
</html>
