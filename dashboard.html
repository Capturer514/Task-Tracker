<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    </nav>

    <div class="container mt-4">
        <h1>Welcome again, University Student!</h1>
        <p class="lead">Here is the summary of your progress and tasks</p>
        
        <div class="row mb-5">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Tasks</h5>
                    <p class="card-text fs-1" id="total-tasks-count">15</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Completed</h5>
                    <p class="card-text fs-1" id="completed-tasks-count">9</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <h2 class="mb-3 text-center">Task Activity Distribution</h2>
                <div class="card p-3 shadow-sm">
                    <canvas id="taskStatusChart"></canvas>
                </div>
            </div>
        </div>

        <footer class="footer bg-light border-top mt-5 py-3">
            <div class="container text-center">
                <span class="text-muted">Task Tracker App | &copy; 2025</span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
</body>    
</html>
