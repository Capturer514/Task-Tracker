<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
         <div class="container">
            <a class="navbar-brand" href="dashboard.html">Task Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="current_tasks.html">Current Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="archived_tasks.html">Completed</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Welcome again, University Student!</h1>
        <p class="lead">Here is the summary of your progress and tasks!</p>
        
        <div class="row mb-5 text-center">
            <div class="col-md-4">
                <div class="card bg mb-3">
                    <div class="card dashboard-card">
                        <h5 class="card-title">Total Tasks</h5>
                        <p class="card-text fs-1" id="total-tasks-count">15</p>
                    </div>
                </div>
            </div>

        <div class="col-md-4">
            <div class="card bg-success mb-3">
                <div class="card dashboard-card">
                    <h5 class="card-title">Completed</h5>
                    <p class="card-text fs-1" id="completed-tasks-count">9</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning mb-3">
                <div class="card dashboard-card">
                    <h5 class="card-tile">Pending</h5>
                    <p class="card-text fs-1" id="pending-tasks-count">0</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <h2 class="mb-3 text-center">Task Activity Distribution</h2>
                <div class="card p-3 shadow-sm">
                    <canvas id="taskStatusChart"></canvas>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
</body>    
</html>
