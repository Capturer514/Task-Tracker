<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Archived Tasks (Completed)</h1>
        
        <div class="table responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
        </div>
        
        <thead class="table-dark">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Task Name</th>
                <th scope="col">Status</th>
                <th scope="col">Due Date</th>
                <th scope="col">Category</th>
            </tr>
        </thead>
            <tbody id="current-tasks-table-body">
        </tbody>
    </table>
    </div>

    <footer class="foote bg-light border-top mt-5 py-3">
        <div class="container text-center">
            <span class="text-muted"> Task Tracker Application</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', ()=> {
        const completedTasks = ALL_TASKS.filter(t => t.status ==="Completed");
       
        renderTasksTable(completedTasks, 'current-tasks-table-body');
    });
    </script>
</body>
</html>
